# DECKARD's .deb and .rpm (nfpm, https://nfpm.goreleaser.com). scripts/build-linux.sh
# puts the built files in dist/pkg, fills in @VERSION@ and @ARCH@ (amd64, arm64) and
# runs nfpm once per format, from the repository's root. The packages put the program
# on the PATH, its desktop entry, icon and file type where the desktop finds them, and
# the udev rule that lets users reach the Maschine MK3 without root; the hooks make
# them take effect at once.
name: deckard
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
release: "1"
section: sound
priority: optional
maintainer: Josh Summitt <joshhsummitt@gmail.com>
vendor: DECKARD
homepage: https://github.com/summitt/deckard
description: |
  Groovebox for Maschine projects and the Maschine MK3.
  DECKARD opens Native Instruments Maschine projects (.mxprj), plays and edits them,
  and runs the Maschine MK3 controller as Maschine does, with its own instruments,
  effects and stem separation.

contents:
  - src: dist/pkg/deckard
    dst: /usr/bin/deckard
    file_info:
      mode: 0755
  - src: scripts/linux/deckard.desktop
    dst: /usr/share/applications/deckard.desktop
    file_info:
      mode: 0644
  - src: scripts/linux/deckard-mime.xml
    dst: /usr/share/mime/packages/deckard.xml
    file_info:
      mode: 0644
  - src: dist/pkg/icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/deckard.png
    file_info:
      mode: 0644
  - src: dist/pkg/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/deckard.png
    file_info:
      mode: 0644
  - src: dist/pkg/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/deckard.png
    file_info:
      mode: 0644
  - src: dist/pkg/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/deckard.png
    file_info:
      mode: 0644
  # The MK3's HID and USB interfaces, for the logged-in user.
  - src: scripts/linux/50-deckard-maschine-mk3.rules
    dst: /usr/lib/udev/rules.d/50-deckard-maschine-mk3.rules
    file_info:
      mode: 0644
  # The stem separation model's installer: DECKARD runs it (from here, next to
  # /usr/bin) when the model is wanted; it downloads into the user's settings folder.
  - src: scripts/install-demucs.sh
    dst: /usr/share/deckard/install-demucs.sh
    file_info:
      mode: 0755
  # yabridge's installer (Windows plug-ins through Wine): Preferences ▸ Plug-ins runs
  # it; it downloads into ~/.local/share/yabridge.
  - src: scripts/install-yabridge.sh
    dst: /usr/share/deckard/install-yabridge.sh
    file_info:
      mode: 0755

overrides:
  deb:
    depends:
      # Ubuntu 24.04 and Debian 13 renamed it for the 64-bit time_t transition.
      - libasound2t64 | libasound2
    recommends:
      - curl
  rpm:
    depends:
      - libasound.so.2()(64bit)
    recommends:
      - curl

scripts:
  postinstall: scripts/linux/postinstall.sh
  postremove: scripts/linux/postremove.sh
