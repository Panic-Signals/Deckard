<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deckard MK3</title>
<link rel="stylesheet" href="/mk3.css">
</head>
<body>
<div id="surface">
  <!-- Decoration, not controls: the fork's static MK3 dressing, same percentages. -->
  <div class="mk3-display-box"></div>
  <div class="mk3-strip-dots"></div>
  <i class="mk3-jdot jd1"></i><i class="mk3-jdot jd2"></i><i class="mk3-jdot jd3"></i><i class="mk3-jdot jd4"></i>
  <div class="mk3-logo"><span></span>MASCHINE</div>
</div>
<div id="rotate">Turn your phone sideways to play.</div>
<div id="status"></div>
<script src="/mk3.js"></script>
</body>
</html>
