[package]
name = "deckard-stems"
version = "0.1.0"
edition = "2024"
description = "Stem separation (Maschine's EDIT ▸ STEMS): Demucs v4 (htdemucs) through demucs-rs"

[dependencies]
# demucs-rs (Apache-2.0), pinned: it isn't on crates.io. Its model, htdemucs, is Meta's
# (MIT); the weights are fetched at install (scripts/install-demucs.sh), never bundled.
demucs-core = { git = "https://github.com/nikhilunni/demucs-rs", rev = "805d6f72ede20282832ac78c634e8767716c0b21", features = ["ndarray", "wgpu", "fusion", "autotune"] }
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "wgpu"] }
pollster = "0.4"
sha2 = "0.10"

# The GPU through Metal on macOS, Vulkan elsewhere (the CPU when there's none).
[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "wgpu", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "wgpu", "vulkan"] }

[dev-dependencies]
tempfile = "3.27.0"
hound = "3"
