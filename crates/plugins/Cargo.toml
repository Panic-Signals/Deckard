[package]
name = "deckard-plugins"
version = "0.1.0"
edition = "2024"
description = "Hosts the VST3 plug-ins a Maschine project uses"

[dependencies]
deckard-mi = { path = "../mi" }
vst3 = "0.3"
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# dlopen / LoadLibrary of a bundle's shared library.
[target.'cfg(not(target_os = "macos"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The X11 window a plug-in's editor lives in (pure Rust; talks to the X socket itself).
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
deckard-model = { path = "../model" }
mxprj = { path = "../mxprj" }

# Plug-ins load on the main thread only: this test runs its own `main`.
[[test]]
name = "vst3_state"
harness = false
