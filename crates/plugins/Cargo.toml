[package]
name = "deckard-plugins"
version = "0.1.0"
edition = "2024"
description = "Hosts the VST3 plug-ins a Maschine project uses"

[dependencies]
deckard-mi = { path = "../mi" }
vst3 = "0.3"
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
deckard-model = { path = "../model" }
mxprj = { path = "../mxprj" }

# Plug-ins load on the main thread only: this test runs its own `main`.
[[test]]
name = "vst3_state"
harness = false
