[package]
name = "transit-audio-asio"
description = "transit's native ASIO backend, vendored from transit-audio/transit (MIT OR Apache-2.0; see NOTICE.md): hand-written IASIO bindings, no ASIO SDK. Empty off 64-bit Windows"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# No ASIO SDK, no C++ and no bindgen: the IASIO ABI is declared in `src/abi.rs`.
[target.'cfg(all(windows, target_pointer_width = "64"))'.dependencies]
transit-audio-backend = { path = "../transit-audio-backend" }
log = "0.4"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Sanctioned `unsafe` (COM, the registry, the host thread's window, the IASIO vtable, the
# driver's callbacks), as in transit: every block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
