[package]
name = "deckard-engine"
version = "0.1.0"
edition = "2024"
description = "Sample playback engine for Maschine projects"

[dependencies]
hound = "3.5.1"
lewton = "0.10.2"
deckard-model = { path = "../model" }
deckard-stretch = { path = "../stretch" }
deckard-plugins = { path = "../plugins" }
plist = "1"
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The sound cards and what they can do (cpal lists ALSA's PCMs, not cards).
alsa = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Real-time output through the default audio device (`output` module).
output = ["dep:cpal", "dep:alsa"]
