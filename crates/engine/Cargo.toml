[package]
name = "deckard-engine"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Sample playback engine for Maschine projects"

[dependencies]
hound = "3.5.1"
lewton = "0.10.2"
deckard-model = { path = "../model" }
deckard-stretch = { path = "../stretch" }
deckard-plugins = { path = "../plugins" }
plist = "1"
realfft = "3.5"
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The sound cards and what they can do (cpal lists ALSA's PCMs, not cards).
alsa = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Real-time output through the default audio device (`output` module).
output = ["dep:cpal", "dep:alsa"]
# Windows: ASIO as well as WASAPI. Building it needs the ASIO SDK and libclang (see
# DEVELOPMENT.md).
asio = ["output", "cpal/asio"]
# Windows (x86_64): ASIO through transit's native backend, which needs no SDK (see
# DEVELOPMENT.md and crates/transit-audio-asio/NOTICE.md). With `asio` also on, the SDK's wins.
asio-native = ["output", "dep:transit-audio-asio", "dep:transit-audio-backend"]

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transit-audio-asio = { path = "../transit-audio-asio", optional = true }
transit-audio-backend = { path = "../transit-audio-backend", optional = true }
