# Build DECKARD for macOS, Linux and Windows when a release is published on GitHub, and
# attach the builds to it. The version is the release's name (else its tag), without a
# leading "v": a release named "v1.2.0" gives DECKARD 1.2.0 and
# DECKARD-1.2.0-macos-universal.zip, deckard-1.2.0-linux-x86_64.tar.gz (with
# deckard_1.2.0-1_amd64.deb and deckard-1.2.0-1.x86_64.rpm) and DECKARD-1.2.0-windows-x64.zip.
#
# "published" covers both creating a release directly and publishing a draft (drafts
# themselves don't start workflows). Run it by hand (Actions > Release > Run workflow)
# to build a version without a release: the builds are kept as workflow artifacts.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 1.2.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            # The oldest supported runner: builds against an older glibc run on more
            # distributions.
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The pinned Rust and tools (mise.toml).
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: bash
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${RELEASE_NAME:-$RELEASE_TAG}}"
          [ -n "$v" ] || v="$RELEASE_TAG"
          v="${v#v}"; v="${v#V}"
          # Keep it to what file names and bundle versions take.
          v="$(printf '%s' "$v" | tr ' /' '--' | tr -cd 'A-Za-z0-9._+-')"
          [ -n "$v" ] || { echo "no version in the release name or tag" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "DECKARD $v"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TASK: ${{ runner.os == 'macOS' && 'release:macos' || runner.os == 'Linux' && 'release:linux' || 'release:windows' }}
        run: mise run "$TASK" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: deckard-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.deb dist/*.rpm)
          gh release upload "$TAG" "${files[@]}" --clobber
